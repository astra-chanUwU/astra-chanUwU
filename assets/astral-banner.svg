  <circle cx="951" cy="157" r="77" fill="url(#planet)" opacity=".95"/>
  <path d="M884 135c25-36 78-50 118-25-28-2-55 16-65 43-12 31 1 61 27 79-49-5-86-48-80-97Z" fill="#171631" opacity=".86"/>
  <path d="M868 218c42 24 116 29 174-8" fill="none" stroke="#ffd6ef" stroke-opacity=".55" stroke-width="7"/>
  <path d="M52 244c172-35 291 28 430-5 106-25 165-18 249 7" fill="none" stroke="#c1b3ff" stroke-opacity=".25" stroke-width="2"/>
  <g fill="#fff7ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="88" y="126" font-size="22" letter-spacing="6" fill="#f9c5e5">HELLO, STARLIGHT</text>
    <text x="82" y="184" font-size="52" font-weight="700" letter-spacing="1">Astra-chan desu!</text>
    <text x="88" y="222" font-size="20" fill="#e4d9ff">little worlds · careful code · soft chaos</text>
